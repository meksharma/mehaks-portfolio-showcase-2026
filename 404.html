<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#11141f">
  <title>Page not found — Mehak Sharma</title>
  <link rel="icon" type="image/png" href="/logo-blue-icon-square.png">
  <style>
    :root {
      color-scheme: dark;
      font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #11141f;
      color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100svh;
      margin: 0;
      padding: 2rem;
      place-items: center;
      background:
        radial-gradient(circle at 18% 18%, rgba(71, 85, 244, 0.22), transparent 32rem),
        #11141f;
    }

    main {
      width: min(44rem, 100%);
    }

    p {
      margin: 0;
      color: #aeb6d1;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .code {
      margin-bottom: 1.25rem;
      color: #9ba6ff;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 10ch;
      margin: 0 0 1.25rem;
      font-size: clamp(3rem, 10vw, 6.5rem);
      font-weight: 500;
      letter-spacing: 0;
      line-height: 0.95;
    }

    a {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      min-height: 2.75rem;
      margin-top: 2rem;
      color: #fff;
      font-weight: 650;
      text-decoration: none;
    }

    a span {
      color: #9ba6ff;
      font-size: 1.3rem;
    }

    a:focus-visible {
      outline: 2px solid #9ba6ff;
      outline-offset: 6px;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404 / Page not found</p>
    <h1>This page wandered off.</h1>
    <p>The work is still here. Head back to Mehak’s portfolio to continue exploring.</p>
    <a href="/">Return to portfolio <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
